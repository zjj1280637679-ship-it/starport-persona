name: MingQing Live Smoke Test
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/mingqing-live-smoke.yml'
      - 'mingqing-mirror/app.js'
      - 'mingqing-mirror/data.js'
      - 'mingqing-mirror/index.html'
      - 'mingqing-mirror/styles.css'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check live frontend, worker, and request guards (no paid AI calls)
        env:
          SITE_URL: https://zjj1280637679-ship-it.github.io/starport-persona/mingqing-mirror/
          WORKER_URL: https://starport-deepseek-gateway.zjj1280637679.workers.dev
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error
          site=os.environ['SITE_URL']; worker=os.environ['WORKER_URL']
          def request(url, method='GET', headers=None, data=None):
              r=urllib.request.Request(url,method=method,headers=headers or {},data=data)
              try:
                  with urllib.request.urlopen(r,timeout=20) as out:
                      return out.status,{k.lower():v for k,v in out.headers.items()},out.read().decode('utf8','replace')
              except urllib.error.HTTPError as e:
                  return e.code,{k.lower():v for k,v in e.headers.items()},e.read().decode('utf8','replace')
          for attempt in range(18):
              st,_,page=request(site)
              ct,_,cfg=request(site+'ai-config.js')
              js_status,_,js=request(site+'app.js')
              css_status,_,css=request(site+'styles.css')
              if st==200 and ct==200 and js_status==200 and css_status==200 and '>攻略</a>' in page and 'Home is intentionally an introduction only' in js and 'Accessible answer controls on the parchment' in css and 'starport-deepseek-gateway.zjj1280637679.workers.dev' in cfg and 'turnstileSiteKey:' in cfg and 'turnstileSiteKey:""' not in cfg:break
              print('Pages propagation pending',attempt+1,st,ct,flush=True);time.sleep(10)
          else:raise AssertionError('Live GitHub Pages frontend is not ready')
          assert 'id="app"' in page and 'app.js' in page, 'HTML bootstrap missing'
          print('PASS: live HTML and public frontend AI config')
          st,_,body=request(worker+'/health')
          print('HEALTH status:',st,'body-prefix:',repr(body[:400]),flush=True)
          if st==403 and 'error code: 1010' in body:
              print('::warning::Cloudflare 1010 blocks GitHub runner from Worker; Worker API tests cannot be assessed from this runner.')
              raise SystemExit(0)
          obj=json.loads(body)
          assert st==200 and all(obj.get(k) is True for k in ('ok','configured','enabled')),(st,obj)
          print('PASS: Worker /health (both secrets recognized and AI enabled)')
          origin='https://zjj1280637679-ship-it.github.io'
          st,h,_=request(worker+'/api/analyze',method='OPTIONS',headers={'Origin':origin,'Access-Control-Request-Method':'POST','Access-Control-Request-Headers':'content-type'})
          assert st==204 and h.get('access-control-allow-origin')==origin,(st,h)
          print('PASS: CORS preflight allowed')
          body=json.dumps({'questionId':'p1','answer':'test-no-paid-model-call'}).encode('utf-8')
          st,_,text=request(worker+'/api/analyze',method='POST',headers={'Origin':'https://untrusted.invalid','Content-Type':'application/json'},data=body)
          assert st==403 and 'origin_rejected' in text,(st,text)
          print('PASS: unknown Origin rejected')
          st,_,text=request(worker+'/api/analyze',method='POST',headers={'Origin':origin,'Content-Type':'application/json'},data=body)
          assert st==403 and 'challenge_required' in text,(st,text)
          print('PASS: missing Turnstile token rejected; no paid DeepSeek call')
          PY
      - name: Validate all historical case dossiers and original scoring dimensions
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const source=readFileSync('mingqing-mirror/data.js','utf8');
          const {QUESTIONS,CASE_BRIEFS,MODES}=await import('data:text/javascript;base64,'+Buffer.from(source).toString('base64'));
          if(QUESTIONS.length!==28||Object.keys(CASE_BRIEFS).length!==28)throw Error('Expected 28 original questions and 28 contextual dossiers');
          for(const q of QUESTIONS){
            const b=CASE_BRIEFS[q.id];
            if(!b||[b.place,b.role,b.mission,b.scope].some(x=>typeof x!=='string'||x.trim().length<3))throw Error('Missing case identity or mandate for '+q.id);
            if(!q.title||!q.scene||!q.ask||!q.group||!q.axis)throw Error('Question fields damaged: '+q.id);
            if(q.group==='wit'&&(q.options?.length!==4||!Number.isInteger(q.correct)))throw Error('Wit answer altered: '+q.id);
          }
          if(MODES.quick.ids.length!==12||MODES.standard.ids.length!==28)throw Error('Question modes changed');
          console.log('PASS: All 28 cases have roles, places, missions and stakes; quiz modes/answer keys remain structurally intact.');
          JS
      - name: Install Playwright browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Real browser smoke (mobile iPhone viewport, offline fallback)
        env:
          SITE_URL: https://zjj1280637679-ship-it.github.io/starport-persona/mingqing-mirror/
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:2,isMobile:true,hasTouch:true});
          const errors=[], paidCalls=[];
          page.on('pageerror',e=>errors.push(String(e)));
          page.on('request',r=>{if(r.url().includes('/api/analyze')||r.url().includes('/api/rewrite')||r.url().includes('/api/commentary'))paidCalls.push(r.url())});
          const response=await page.goto(process.env.SITE_URL,{waitUntil:'domcontentloaded',timeout:45000});
          if(response?.status()!==200)throw Error('Live page not HTTP 200');
          // Landing page contains only introductory hero and one entry action.
          if(await page.locator('.hero-actions [data-action="enter"]').count()!==1)throw Error('Landing page should have exactly one entry action');
          if(await page.locator('main .section').count()!==0)throw Error('Guide sections leaked into landing page');
          await page.screenshot({path:'mingqing-home-mobile.png',fullPage:true});
          await page.locator('nav a[href="#about"]').click();
          await page.getByText('四镜相合，方见其人').waitFor({state:'visible'});
          await page.getByText('美术升级：图形 → 图片 → GIF').waitFor({state:'visible'});
          if(await page.locator('.mode-grid').count())throw Error('Game entry options should not be mixed with guide');
          await page.locator('nav a[href="#home"]').click();
          await page.getByRole('button',{name:/启封入卷/}).click();
          await page.getByText('当前：DeepSeek AI 辅助（默认开启）').waitFor({state:'visible'});
          if(await page.locator('#ai-consent').count())throw Error('Obsolete consent checkbox still exists');
          await page.getByRole('button',{name:'改用纯离线模式'}).click();
          await page.getByText('当前：纯离线模式').waitFor({state:'visible'});
          await page.getByRole('button',{name:/速鉴十二问/}).click();
          const draftOffline=await page.evaluate(()=>JSON.parse(localStorage.getItem('mingqing-mirror:draft-v1')));
          if(draftOffline?.aiConsent!==false)throw Error('Offline switch did not disable AI calls');
          await page.locator('#answer').waitFor({state:'visible'});
          await page.getByText('乱世鉴司 · 入局说明').waitFor({state:'visible'});
          const roleOne=await page.locator('.case-role strong').textContent();
          if(!roleOne?.trim())throw Error('First question has no declared identity');
          if(await page.locator('.case-dossier p').count()!==2)throw Error('Question needs mission and scope');
          await page.getByText('前情与任务：').waitFor({state:'visible'});
          await page.getByText('权限与代价：').waitFor({state:'visible'});
          const pills=page.locator('.quiz-card .pill-row button');
          if(await pills.count()!==3)throw Error('Expected exactly three answer tendency buttons');
          function luminance(rgb){
            const v=rgb.match(/[0-9.]+/g)?.slice(0,3).map(x=>Number(x)/255)??[];
            if(v.length!==3)throw Error('Unrecognized computed color '+rgb);
            const p=v.map(n=>n<=.04045?n/12.92:((n+.055)/1.055)**2.4);
            return p[0]*.2126+p[1]*.7152+p[2]*.0722;
          }
          async function checkContrast(el,description){
            const v=await el.evaluate(x=>{const s=getComputedStyle(x);return {color:s.color,bg:s.backgroundColor}});
            const a=luminance(v.color),b=luminance(v.bg);
            const ratio=(Math.max(a,b)+.05)/(Math.min(a,b)+.05);
            if(ratio<4.5)throw Error(description+' insufficient contrast '+ratio.toFixed(2)+' / '+JSON.stringify(v));
            console.log('PASS: '+description+' contrast '+ratio.toFixed(2)+':1');
          }
          for(let i=0;i<3;i++)await checkContrast(pills.nth(i),'unselected tendency '+i);
          await pills.first().click();
          await checkContrast(page.locator('.quiz-card .pill-row button.selected'),'selected tendency');
          await page.screenshot({path:'mingqing-question-buttons.png',fullPage:true});
          await page.locator('#answer').fill('我会先听取各方意见，并核查实际账目。');
          await page.getByRole('button',{name:/下一题/}).click();
          await page.getByText('第 2 / 12 问').waitFor({state:'visible',timeout:20000});
          const roleTwo=await page.locator('.case-role strong').textContent();
          if(!roleTwo?.trim()||roleOne===roleTwo)throw Error('Scenario identity did not change between distinct dossiers');
          for(let i=2;i<=12;i++){
            const answer=page.locator('#answer');
            if(await answer.count())await answer.fill('我会依据事实，听取各方意见后制定下一步计划。');
            else await page.locator('.choice').first().click();
            await page.locator('[data-action="next"]').click();
            if(i<12)await page.getByText('第 '+(i+1)+' / 12 问').waitFor({state:'visible',timeout:15000});
          }
          await page.getByText('乱世鉴书',{exact:true}).first().waitFor({state:'visible',timeout:15000});
          await page.locator('.match-name').first().waitFor({state:'visible'});
          await page.screenshot({path:'mingqing-mobile-test.png',fullPage:true});
          await page.locator('a[href="#archive"]').last().click();
          await page.locator('.archive-row').first().waitFor({state:'visible',timeout:15000});
          console.log('PASS: Intro and two distinct case roles; minimal homepage; isolated guide; button contrast; all 12 questions completed and archived.');
          if(errors.length)throw Error('Browser JS exceptions: '+errors.join(' | '));
          if(paidCalls.length)throw Error('Opt-out incorrectly sent paid API requests: '+paidCalls.join(','));
          console.log('PASS: Mobile browser rendered; navigation, test choices and second question work.');
          console.log('PASS: AI opt-out triggered no API requests.');
          // Test the AI-on default in an isolated browser session, using mocked
          // Turnstile and model replies to avoid charging real API credits.
          const aiPage=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
          const seen=[];
          await aiPage.addInitScript(()=>{
            window.turnstile={render:(_node,settings)=>{queueMicrotask(()=>settings.callback('local-test-token'));return 1},remove:()=>{}};
          });
          await aiPage.route('**/api/analyze',async route=>{
            const req=route.request();
            if(req.method()==='OPTIONS')return route.fulfill({status:204,headers:{'access-control-allow-origin':'https://zjj1280637679-ship-it.github.io','access-control-allow-methods':'POST, OPTIONS','access-control-allow-headers':'content-type'}});
            seen.push(JSON.parse(req.postData()||'{}'));
            await route.fulfill({status:200,contentType:'application/json',headers:{'access-control-allow-origin':'https://zjj1280637679-ship-it.github.io'},body:JSON.stringify({keep:false,analysis:{value:0.6,confidence:0.93,quote:'听取各方意见'}})});
          });
          await aiPage.goto(process.env.SITE_URL,{waitUntil:'domcontentloaded',timeout:45000});
          await aiPage.getByRole('button',{name:/启封入卷/}).click();
          await aiPage.getByText('当前：DeepSeek AI 辅助（默认开启）').waitFor({state:'visible'});
          if(await aiPage.locator('#ai-consent').count())throw Error('Consent checkbox unexpectedly required on AI-by-default flow');
          await aiPage.getByRole('button',{name:/速鉴十二问/}).click();
          const draftDefault=await aiPage.evaluate(()=>JSON.parse(localStorage.getItem('mingqing-mirror:draft-v1')));
          if(draftDefault?.aiConsent!==true)throw Error('AI is not enabled by default');
          await aiPage.locator('#answer').fill('我会先听取各方意见，并核查实际账目。');
          await aiPage.getByRole('button',{name:/下一题/}).click();
          await aiPage.getByText('第 2 / 12 问').waitFor({state:'visible',timeout:20000});
          if(seen.length!==1||seen[0]?.answer!=='我会先听取各方意见，并核查实际账目。')throw Error('Default AI did not route submitted answer correctly: '+JSON.stringify(seen));
          const after=await aiPage.evaluate(()=>JSON.parse(localStorage.getItem('mingqing-mirror:draft-v1')));
          if(!Object.values(after.answers).some(x=>x.ai?.quote==='听取各方意见'))throw Error('Mocked AI evidence not applied to scoring state');
          console.log('PASS: AI on by default: answer sent to mocked backend and its evidence saved.');
          const standard=await browser.newPage({viewport:{width:390,height:844},isMobile:true});
          await standard.goto(process.env.SITE_URL,{waitUntil:'domcontentloaded',timeout:45000});
          await standard.getByRole('button',{name:/启封入卷/}).click();
          await standard.getByRole('button',{name:/史鉴二十八问/}).click();
          await standard.getByText('第 1 / 28 问').waitFor({state:'visible'});
          if(await standard.locator('.case-dossier .case-role strong').count()!==1)throw Error('28-case mode missing role dossier');
          console.log('PASS: 28-question mode also begins with explicit historical player identity.');
          await standard.close();
          console.log('LIMIT: Real managed Turnstile challenge and paid DeepSeek response require verified visitor interaction.');
          await aiPage.close();
          await browser.close();
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mingqing-mobile-smoke
          path: |
            mingqing-home-mobile.png
            mingqing-question-buttons.png
            mingqing-mobile-test.png
          if-no-files-found: ignore

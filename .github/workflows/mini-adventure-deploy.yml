name: Mini Adventure Worker deploy (when configured)
on:
  push:
    branches: [main]
    paths:
      - 'deepseek-worker/src/mini-adventure.mjs'
      - 'deepseek-worker/src/index.js'
      - 'deepseek-worker/wrangler.toml'
      - '.github/workflows/mini-adventure-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mini-adventure-worker-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test isolated and existing routes
        run: |
          node deepseek-worker/test-mini-adventure.mjs
          node deepseek-worker/test-jiuzhou.mjs
          node gm-harness/test.mjs
      - name: Check whether existing Cloudflare CI credentials are present
        id: credentials
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo '::notice::Worker not deployed because Cloudflare repo Actions credentials are absent. Use Manual Worker deploy or Wrangler after configuring secrets.'
          fi
      - name: Deploy additive Worker route and KV binding
        if: steps.credentials.outputs.ready == 'true'
        working-directory: deepseek-worker
        run: npx --yes wrangler@4 deploy
      - name: Check public mini-adventure API without invoking paid AI
        if: steps.credentials.outputs.ready == 'true'
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 4 \
            https://starport-deepseek-gateway.zjj1280637679.workers.dev/api/mini-adventure/public \
            | node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{const j=JSON.parse(s);if(!j.title || !j.intro)process.exit(1);console.log("PASS public config: "+j.title)})'
name: Manual Worker deploy fallback
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jiuzhou-worker-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Worker before deployment (no paid calls)
        run: |
          node --check deepseek-worker/src/index.js
          node deepseek-worker/test-jiuzhou.mjs
          node gm-harness/test.mjs
      - name: Deploy using existing Cloudflare repository secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: deepseek-worker
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::Worker was not deployed. Set the existing account's CLOUDFLARE_API_TOKEN repository secret with Worker deployment permission, or deploy deepseek-worker manually with Wrangler."
            exit 1
          fi
          echo "Cloudflare token configured; attempting deployment using existing Wrangler config."
          npx --yes wrangler@4 deploy

name = "starport-deepseek-gateway"
main = "src/index.js"
compatibility_date = "2026-10-13"

# Public configuration only. DO NOT commit API credentials or Turnstile secret here.
[vars]
AI_ENABLED = "true"
# GM needs an explicit operator enable; public model calls incur spend.
GM_ENABLED = "false"
# Jiuzhou uses the server key directly; its operator/challenge/rate gates were removed by owner request.
DEEPSEEK_MODEL = "deepseek-flash"
ALLOWED_ORIGIN = "https://zjj1280637679-ship-it.github.io"

# Legacy APIs only; Jiuzhou does not use this quota.
[[ratelimits]]
name = "AI_LIMITER"
namespace_id = "1001"
[ratelimits.simple]
limit = 12
period = 60

# Independent conservative limit for paid freeform GM turns.
[[ratelimits]]
name = "GM_LIMITER"
namespace_id = "1002"
[ratelimits.simple]
limit = 3
period = 60

# Minimal adventure only: automatically provision a dedicated KV store on Wrangler v4 deploy.
[[kv_namespaces]]
binding = "ADVENTURE_CONFIG"

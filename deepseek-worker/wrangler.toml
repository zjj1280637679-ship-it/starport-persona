name = "starport-deepseek-gateway"
main = "src/index.js"
compatibility_date = "2026-10-13"

# Public configuration only. DO NOT commit API credentials or Turnstile secret here.
[vars]
AI_ENABLED = "true"
# GM needs an explicit operator enable; public model calls incur spend.
GM_ENABLED = "false"
# Owner approved live test for Jiuzhou; rate limiting and Turnstile remain mandatory.
JIUZHOU_ENABLED = "true"
DEEPSEEK_MODEL = "deepseek-flash"
ALLOWED_ORIGIN = "https://zjj1280637679-ship-it.github.io"

# Per visitor-network quota; not a substitute for the upstream provider's spending limits.
[[ratelimits]]
name = "AI_LIMITER"
namespace_id = "1001"
[ratelimits.simple]
limit = 12
period = 60

# Independent conservative limit for paid freeform GM turns.
[[ratelimits]]
name = "GM_LIMITER"
namespace_id = "1002"
[ratelimits.simple]
limit = 3
period = 60
